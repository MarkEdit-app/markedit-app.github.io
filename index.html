<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarkEdit</title>
  <meta name="description" content="MarkEdit is a free, open-source Markdown editor for macOS. Download the app, browse extensions and themes, and explore the documentation.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="MarkEdit">
  <meta property="og:site_name" content="MarkEdit">
  <meta property="og:description" content="A free, open-source Markdown editor for macOS.">
  <meta property="og:url" content="https://markedit-app.github.io/">
  <link rel="canonical" href="https://markedit-app.github.io/">
  <link rel="icon" type="image/png" href="/extensions/favicons/favicon.png">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "MarkEdit",
    "url": "https://markedit-app.github.io/"
  }
  </script>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { margin: 0; }
    main { max-width: 42rem; margin: 12vh auto; padding: 0 1.5rem; }
    h1 { font-size: 3rem; margin-bottom: 1rem; }
    p, li { font-size: 1.125rem; line-height: 1.7; }
    ul { padding-left: 1.25rem; }
    li { margin: 0.75rem 0; }
    a { color: #0969da; text-underline-offset: 0.2em; }
    a:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
    @media (prefers-color-scheme: dark) { a { color: #79c0ff; } }
  </style>
</head>
<body>
  <main>
    <h1>MarkEdit</h1>
    <p>A free, open-source Markdown editor for macOS.</p>
    <nav aria-label="Main">
      <ul>
        <li><a href="https://github.com/MarkEdit-app/MarkEdit/releases/latest">Download MarkEdit</a></li>
        <li><a href="/extensions/">Browse MarkEdit extensions and themes</a></li>
        <li><a href="https://github.com/MarkEdit-app/MarkEdit/wiki">Read the documentation</a></li>
        <li><a href="https://github.com/MarkEdit-app/MarkEdit">View the source on GitHub</a></li>
      </ul>
    </nav>
  </main>
</body>
</html>
